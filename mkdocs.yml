site_name: labctl
site_description: Local dev labs without the nonsense.
site_url: https://maccalsa.github.io/labctl
repo_url: https://github.com/maccalsa/labctl
repo_name: maccalsa/labctl

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.instant
    - navigation.sections
    - navigation.top
    - toc.follow

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - CLI Reference: cli-reference.md
  - Cheat Sheet: cheatsheet.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labctl"
version = "0.1.0"
description = "Local dev labs without the nonsense."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "maccalsa" }]
dependencies = ["typer>=0.15", "docker>=7.0", "rich>=13.0"]

[project.scripts]
labctl = "labctl.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=6.0", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/labctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
